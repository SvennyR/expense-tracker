
services:
  postgres:
    image: postgres:15-alpine
    container_name: expense_tracker_db
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: expense_tracker_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://devuser:devpassword@postgres:5432/expense_tracker
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: expense_tracker_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data: